---
### Custom Card: Plant watering history (ULM extension) ###
#
# Vattningshistorik block used in per-plant subviews. Renders:
#   📊 Vattningshistorik
#   Snitt: X d · Inställt: Y d · Drift: ±Z d · N totalt
#   ─────────────────
#   Tidigare vattningar:
#     • YYYY-MM-DD HH:MM
#     • …
#
# Reads sensor.plants_watering_stats.<slug> (count, avg_interval_days, recent[])
# and sensor.plant_<slug>.attributes.interval_days for the configured interval.
#
# Variables:
#   ulm_plant_slug   (required)   e.g. "dill"

custom_card_mans_plant_history:
  triggers_update: "all"
  show_name: true
  show_label: true
  show_icon: false
  name: "📊 Vattningshistorik"
  label: >
    [[[
      var s = states['sensor.plants_watering_stats'].attributes[variables.ulm_plant_slug];
      if (!s || s.count < 2) return 'För få vattningar för statistik ännu';
      var plant = states['sensor.plant_' + variables.ulm_plant_slug];
      var cfg = plant ? plant.attributes.interval_days : '?';
      var drift = (s.avg_interval_days - cfg).toFixed(1);
      var sign = drift >= 0 ? '+' : '';
      return 'Snitt: ' + s.avg_interval_days + ' d  ·  Inställt: ' +
             cfg + ' d  ·  Drift: ' + sign + drift + ' d  ·  ' +
             s.count + ' totalt';
    ]]]
  tap_action:
    action: "none"
  styles:
    grid:
      - grid-template-areas: "'n' 'l' 'recent'"
      - grid-template-columns: "1fr"
      - row-gap: "6px"
    card:
      - border-radius: "12px"
      - padding: "16px 14px"
    name:
      - justify-self: "start"
      - font-weight: "bold"
      - font-size: "1.2rem"
    label:
      - justify-self: "start"
      - font-size: "0.9rem"
      - opacity: "0.7"
    custom_fields:
      recent:
        - justify-self: "start"
        - text-align: "left"
        - font-size: "13px"
        - line-height: "1.7"
        - padding-top: "10px"
        - border-top: "1px solid rgba(127,127,127,0.2)"
        - width: "100%"
  custom_fields:
    recent: >
      [[[
        var s = states['sensor.plants_watering_stats'].attributes[variables.ulm_plant_slug];
        if (!s || !s.recent || s.recent.length < 2) {
          return '<div style="text-align:left;width:100%;"><i>Inga tidigare vattningar loggade.</i></div>';
        }
        var p = function(n){ return n < 10 ? '0' + n : '' + n; };
        var fmt = function(ts){
          var d = new Date(ts);
          if (isNaN(d.getTime())) return ts;
          return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
                 ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
        };
        var html = '<div style="text-align:left;width:100%;">';
        html += '<b>Tidigare vattningar:</b><ul style="margin:6px 0 0 0;padding-left:20px;">';
        for (var i = 1; i < s.recent.length; i++) {
          html += '<li>' + fmt(s.recent[i]) + '</li>';
        }
        html += '</ul></div>';
        return html;
      ]]]
