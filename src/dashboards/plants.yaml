                          - column-gap: "6px"
                        card:
                          - background-color: "rgba(var(--color-blue, 61,90,254), 0.18)"
                          - border-radius: "16px"
                          - padding: "6px 12px"
                          - box-shadow: "none"
                          - place-self: "center end"
                        icon:
                          - color: "rgba(var(--color-blue, 61,90,254), 1)"
                          - width: "18px"
                          - height: "18px"
                        name:
                          - font-size: "13px"
                          - font-weight: "bold"

              - type: custom:button-card
                template: custom_card_mans_plant
                variables:
                  ulm_plant_slug: orkide
                  ulm_plant_icon: mdi:flower
              - type: custom:button-card
