- binary_sensor:
    - name: Mans Home Wifi
      unique_id: mans_home_wifi
      state: >-
        {% set ssid = states('sensor.mans_iphone_x_ssid') %}
        {% if ssid == '404 - Not Found' %}
          true
        {% elif ssid in ['unknown', 'unavailable'] %}
          {{ this.state == 'on' }}
        {% else %}
          false
        {% endif %}
      delay_off: "00:02:00"

    - name: Agnes Home Wifi
      unique_id: agnes_home_wifi
      state: >-
        {% set ssid = states('sensor.agnes_iphone_ssid_2') %}
        {% if ssid == '404 - Not Found' %}
          true
        {% elif ssid in ['unknown', 'unavailable'] %}
          {{ this.state == 'on' }}
        {% else %}
          false
        {% endif %}
      delay_off: "00:02:00"

    - name: Anyone Home
      unique_id: anyone_home
      state: >-
        {{ is_state('binary_sensor.mans_home_wifi', 'on')
           or is_state('binary_sensor.agnes_home_wifi', 'on') }}

- sensor:
    # === Plant sensors ===
    # All four template bodies (state / days_since / last_watered / relative_last_watered)
    # are imported from /config/custom_templates/plants.jinja so each plant only
    # has to specify its own metadata + care notes.
    #
    # Adding a plant: copy a sibling block and swap slug, display_name, room,
    # species, interval, icon, light, water, and care. See .claude/skills/add-plant.md.

    - name: "Plant Dill"
      unique_id: plant_dill
      icon: mdi:sprout
      state: "{% from 'plants.jinja' import plant_state %}{{ plant_state('dill', 2) }}"
      attributes:
        display_name: "Dill"
        room: balcony
        species: "Anethum graveolens"
        interval_days: 2
        days_since: "{% from 'plants.jinja' import days_since %}{{ days_since('dill') }}"
        last_watered: "{{ states('input_datetime.plant_dill_last_watered') }}"
        relative_last_watered: "{% from 'plants.jinja' import relative_last_watered %}{{ relative_last_watered('dill') }}"
        light: "Full sol / halvskugga"
        water: "Ofta — håll jämnt fuktig"
        care: |
          Älskar fukt och tål inte att torka ut.
          Små krukor i västsol torkar snabbt — vattna ofta.
          Plocka blad regelbundet för att hålla plantan i tillväxt.
          Ettårig.

    - name: "Plant Persilja"
      unique_id: plant_persilja
      icon: mdi:sprout
      state: "{% from 'plants.jinja' import plant_state %}{{ plant_state('persilja', 2) }}"
      attributes:
        display_name: "Persilja"
        room: balcony
        species: "Petroselinum crispum"
        interval_days: 2
        days_since: "{% from 'plants.jinja' import days_since %}{{ days_since('persilja') }}"
        last_watered: "{{ states('input_datetime.plant_persilja_last_watered') }}"
        relative_last_watered: "{% from 'plants.jinja' import relative_last_watered %}{{ relative_last_watered('persilja') }}"
        light: "Sol / halvskugga"
        water: "Ofta — håll jämnt fuktig"
        care: |
          Vill ha jämnt fuktig, näringsrik jord.
          Tål viss skugga.
          Plocka yttre blad först — undvik att klippa hela toppen.
          Tvåårig: blommar år två och dör sedan.

    - name: "Plant Timjan"
      unique_id: plant_timjan
      icon: mdi:sprout
      state: "{% from 'plants.jinja' import plant_state %}{{ plant_state('timjan', 4) }}"
      attributes:
        display_name: "Timjan"
        room: balcony
        species: "Thymus vulgaris"
        interval_days: 4
        days_since: "{% from 'plants.jinja' import days_since %}{{ days_since('timjan') }}"
        last_watered: "{{ states('input_datetime.plant_timjan_last_watered') }}"
        relative_last_watered: "{% from 'plants.jinja' import relative_last_watered %}{{ relative_last_watered('timjan') }}"
        light: "Full sol"
        water: "Sparsamt — låt torka mellan"
        care: |
          Medelhavsväxt — torktålig och hatar blöta rötter.
          Vattna först när jorden känns torr.
          Beskär efter blomning för att hålla busken kompakt.
          Härdig perenn.

    - name: "Plant Gräslök"
      unique_id: plant_graslok
      icon: mdi:sprout
      state: "{% from 'plants.jinja' import plant_state %}{{ plant_state('graslok', 2) }}"
      attributes:
        display_name: "Gräslök"
        room: balcony
        species: "Allium schoenoprasum"
        interval_days: 2
        days_since: "{% from 'plants.jinja' import days_since %}{{ days_since('graslok') }}"
        last_watered: "{{ states('input_datetime.plant_graslok_last_watered') }}"
        relative_last_watered: "{% from 'plants.jinja' import relative_last_watered %}{{ relative_last_watered('graslok') }}"
        light: "Sol / halvskugga"
        water: "Ofta — håll jämnt fuktig"
        care: |
          Tål både sol och halvskugga.
          Vill ha jämnt fuktig jord.
          Klipp bladen nära basen — de växer ut igen.
          Härdig — överlever vintern i kruka utomhus.

    - name: "Plant Dahlia"
      unique_id: plant_dahlia
      icon: mdi:flower
      state: "{% from 'plants.jinja' import plant_state %}{{ plant_state('dahlia', 2) }}"
      attributes:
        display_name: "Dahlia"
        room: balcony
        species: "Dahlia (15 cm kruka)"
        interval_days: 2
        days_since: "{% from 'plants.jinja' import days_since %}{{ days_since('dahlia') }}"
        last_watered: "{{ states('input_datetime.plant_dahlia_last_watered') }}"
        relative_last_watered: "{% from 'plants.jinja' import relative_last_watered %}{{ relative_last_watered('dahlia') }}"
        light: "Full sol"
        water: "Ofta — regelbunden vattning"
        care: |
          Knölväxt som vill ha regelbunden vattning och näringsrik jord.
          15 cm kruka torkar snabbt i västsol — vattna ofta i sommar.
          Nyp av vissna blommor för fortsatt blomning.
          Ta in knölen före frost.

    - name: "Plant Pelargon"
      unique_id: plant_pelargon
      icon: mdi:flower
      state: "{% from 'plants.jinja' import plant_state %}{{ plant_state('pelargon', 3) }}"
      attributes:
        display_name: "Pelargon"
        room: balcony
        species: "Pelargonium (15 cm kruka)"
        interval_days: 3
        days_since: "{% from 'plants.jinja' import days_since %}{{ days_since('pelargon') }}"
        last_watered: "{{ states('input_datetime.plant_pelargon_last_watered') }}"
        relative_last_watered: "{% from 'plants.jinja' import relative_last_watered %}{{ relative_last_watered('pelargon') }}"
        light: "Full sol"
        water: "Måttligt — låt torka mellan"
        care: |
          Torktålig — låt jorden torka mellan vattningar.
          Hatar blöta rötter, använd dränerande jord.
          Nyp bort vissna blommor och topparna för buskig form.
          Ta in före frost.

    - name: "Plant Lavendel"
      unique_id: plant_lavandell
      icon: mdi:flower
      state: "{% from 'plants.jinja' import plant_state %}{{ plant_state('lavandell', 5) }}"
      attributes:
        display_name: "Lavendel"
        room: balcony
        species: "Lavandula"
        interval_days: 5
        days_since: "{% from 'plants.jinja' import days_since %}{{ days_since('lavandell') }}"
        last_watered: "{{ states('input_datetime.plant_lavandell_last_watered') }}"
        relative_last_watered: "{% from 'plants.jinja' import relative_last_watered %}{{ relative_last_watered('lavandell') }}"
        light: "Full sol"
        water: "Sparsamt — vill torka ut"
        care: |
          Medelhavsväxt — mycket torktålig och hatar blöta rötter.
          Använd välldränerande jord, blanda gärna med sand eller perlit.
          Vattna sparsamt, bara när jorden är torr.
          Gödsla sparsamt — för mycket näring ger glesa, blomfattiga plantor.
          Beskär efter blomning (sensommar) för att hålla busken kompakt.
          Övervintring: krukodlad lavendel i Sverige behöver vinterskydd —
          flytta mot vägg, isolera kruka, eller ta in i kallt utrymme.
          Endast Lavandula angustifolia är härdig; L. stoechas klarar inte svensk vinter.

    - name: "Plant Murgröna 1"
      unique_id: plant_murgrona_1
      icon: mdi:leaf
      state: "{% from 'plants.jinja' import plant_state %}{{ plant_state('murgrona_1', 3) }}"
      attributes:
        display_name: "Murgröna 1"
        room: balcony
        species: "Hedera helix"
        interval_days: 3
        days_since: "{% from 'plants.jinja' import days_since %}{{ days_since('murgrona_1') }}"
        last_watered: "{{ states('input_datetime.plant_murgrona_1_last_watered') }}"
        relative_last_watered: "{% from 'plants.jinja' import relative_last_watered %}{{ relative_last_watered('murgrona_1') }}"
        light: "Halvskugga / sol"
        water: "Måttligt — tål kort torka"
        care: |
          Tål både sol och halvskugga.
          Vill ha jämnt fuktig jord men klarar kort torka.
          Härdig vintergrön klätterväxt.
          Klipp för att hålla formen.

    - name: "Plant Murgröna 2"
      unique_id: plant_murgrona_2
      icon: mdi:leaf
      state: "{% from 'plants.jinja' import plant_state %}{{ plant_state('murgrona_2', 3) }}"
      attributes:
        display_name: "Murgröna 2"
        room: balcony
        species: "Hedera helix"
        interval_days: 3
        days_since: "{% from 'plants.jinja' import days_since %}{{ days_since('murgrona_2') }}"
        last_watered: "{{ states('input_datetime.plant_murgrona_2_last_watered') }}"
        relative_last_watered: "{% from 'plants.jinja' import relative_last_watered %}{{ relative_last_watered('murgrona_2') }}"
        light: "Halvskugga / sol"
        water: "Måttligt — tål kort torka"
        care: |
          Tål både sol och halvskugga.
          Vill ha jämnt fuktig jord men klarar kort torka.
          Härdig vintergrön klätterväxt.
          Klipp för att hålla formen.

    - name: "Plant Basilika"
      unique_id: plant_basilika
      icon: mdi:sprout
      state: "{% from 'plants.jinja' import plant_state %}{{ plant_state('basilika', 2) }}"
      attributes:
        display_name: "Basilika"
        room: balcony
        species: "Ocimum basilicum"
        interval_days: 2
        days_since: "{% from 'plants.jinja' import days_since %}{{ days_since('basilika') }}"
        last_watered: "{{ states('input_datetime.plant_basilika_last_watered') }}"
        relative_last_watered: "{% from 'plants.jinja' import relative_last_watered %}{{ relative_last_watered('basilika') }}"
        light: "Full sol — 6+ timmar"
        water: "Ofta — håll jämnt fuktig, aldrig blöt"
        care: |
          Älskar värme och full sol — trivs på västbalkongen i sommarvärmen.
          Liten kruka torkar snabbt i eftermiddagssol — vattna ofta, helst på morgonen.
          Håll jorden jämnt fuktig men aldrig blöt — basilika ruttnar lätt vid stillastående vatten.
          Nyp toppskotten regelbundet för buskig planta och fler blad.
          Nyp bort blomknoppar så fort de visar sig — när basilikan blommar slutar bladproduktionen.
          Köldkänslig: ettårig i svenskt klimat, ta in före nattemperaturer under 10 °C.

    - name: "Plant Orkidé"
      unique_id: plant_orkide
      icon: mdi:flower
      state: "{% from 'plants.jinja' import plant_state %}{{ plant_state('orkide', 7) }}"
      attributes:
        display_name: "Orkidé"
        room: studio
        species: "Phalaenopsis (rosa)"
        interval_days: 7
        days_since: "{% from 'plants.jinja' import days_since %}{{ days_since('orkide') }}"
        last_watered: "{{ states('input_datetime.plant_orkide_last_watered') }}"
        relative_last_watered: "{% from 'plants.jinja' import relative_last_watered %}{{ relative_last_watered('orkide') }}"
        light: "Ljust läge utan direkt middagssol"
        water: "Sparsamt — låt barkmediet torka mellan vattningar"
        care: |
          Ljust läge utan direkt brännande middagssol — söderfönster fungerar
          bra med tunn gardin eller en bit in i rummet.
          Vattna genom att doppa krukan i ljummet vatten ~10 min, låt sedan
          rinna av helt. Undvik stillastående vatten i innerkrukan — rötterna
          ruttnar lätt.
          Använd orkidéjord (bark), inte vanlig krukjord.
          Gödsla svagt under tillväxt (var 3:e vattning).
          Klipp av blomstängeln över en nod efter blomning för chans till
          nyblomning. Svalare nattemperatur stimulerar nya blomstänglar.

    - name: "Plant Monstera"
      unique_id: plant_monstera
      icon: mdi:leaf
      state: "{% from 'plants.jinja' import plant_state %}{{ plant_state('monstera', 5) }}"
      attributes:
        display_name: "Monstera"
        room: studio
        species: "Monstera deliciosa (sticklingsplanta)"
        interval_days: 5
        days_since: "{% from 'plants.jinja' import days_since %}{{ days_since('monstera') }}"
        last_watered: "{{ states('input_datetime.plant_monstera_last_watered') }}"
        relative_last_watered: "{% from 'plants.jinja' import relative_last_watered %}{{ relative_last_watered('monstera') }}"
        light: "Ljust indirekt ljus, tål filtrerad sol"
        water: "Måttligt — låt översta 2–3 cm torka mellan"
        care: |
          Ljust indirekt ljus är idealt — direkt middagssol bränner bladen.
          Vattna när översta 2–3 cm jord är torr. Liten kruka torkar snabbt.
          Älskar fukt — duscha bladen eller torka av dem regelbundet.
          Som sticklingsplanta växer den långsamt i början; fenestrationer
          (hål i bladen) kommer först när plantan är större.
          Omplantera när rötterna fyller krukan.

    - name: "Plant Citronfikus"
      unique_id: plant_citronfikus
      icon: mdi:tree
      state: "{% from 'plants.jinja' import plant_state %}{{ plant_state('citronfikus', 7) }}"
      attributes:
        display_name: "Citronfikus"
        room: studio
        species: "Ficus benjamina 'Citrina' (20 cm kruka, äldre exemplar)"
        interval_days: 7
        days_since: "{% from 'plants.jinja' import days_since %}{{ days_since('citronfikus') }}"
        last_watered: "{{ states('input_datetime.plant_citronfikus_last_watered') }}"
        relative_last_watered: "{% from 'plants.jinja' import relative_last_watered %}{{ relative_last_watered('citronfikus') }}"
        light: "Ljust läge, tål filtrerad sol"
        water: "Måttligt — låt jorden torka något mellan"
        care: |
          Trivs i ljust läge med filtrerad sol; tål söderfönster om den inte
          står i stark middagssol hela dagen.
          Vattna när översta jorden är torr; 20 cm kruka håller fukt längre
          så vattna inte för ofta.
          Ogillar att bli flyttad — tappar gärna blad vid stressbyte (växer
          tillbaka).
          Torka av blad regelbundet för att hålla dem rena. Mista då och då
          för luftfuktighet.
          Långlivad: etablerade exemplar är förlåtande och växer långsamt.

    - name: "Plant Palettblad"
      unique_id: plant_palettblad
      icon: mdi:leaf
      state: "{% from 'plants.jinja' import plant_state %}{{ plant_state('palettblad', 3) }}"
      attributes:
        display_name: "Palettblad"
        room: studio
        species: "Plectranthus scutellarioides (10–15 cm kruka)"
        interval_days: 3
        days_since: "{% from 'plants.jinja' import days_since %}{{ days_since('palettblad') }}"
        last_watered: "{{ states('input_datetime.plant_palettblad_last_watered') }}"
        relative_last_watered: "{% from 'plants.jinja' import relative_last_watered %}{{ relative_last_watered('palettblad') }}"
        light: "Ljust, viss direkt sol OK"
        water: "Ofta — gillar fukt, vill inte torka ut"
        care: |
          Ljust läge med viss direkt sol håller färgerna djupa — för lite ljus
          gör bladen blekare.
          Håll jorden lätt fuktig; liten kruka torkar snabbt. Hänger lätt om
          den får torrt.
          Nyp av blomställningar så fort de visar sig — annars går energi från
          de färgglada bladen.
          Sticklingar rotar lätt i vatten om du vill föröka.
          Kan hållas som flerårig inomhus, men växer snabbt och kan behöva
          beskäras eller bytas ut.

    - name: "Plants Needing Water"
      unique_id: plants_needing_water
      icon: mdi:watering-can
      state: >-
        {% set entities = [
          'sensor.plant_dill', 'sensor.plant_persilja', 'sensor.plant_timjan',
          'sensor.plant_graslok', 'sensor.plant_dahlia', 'sensor.plant_pelargon',
          'sensor.plant_lavandell', 'sensor.plant_murgrona_1', 'sensor.plant_murgrona_2',
          'sensor.plant_basilika',
          'sensor.plant_orkide', 'sensor.plant_monstera',
          'sensor.plant_citronfikus', 'sensor.plant_palettblad'
        ] %}
        {% set ns = namespace(count=0) %}
        {% for e in entities %}
          {% if states(e) in ['due', 'overdue'] %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.count }}
      attributes:
        due_now: >-
          {% set entities = [
            'sensor.plant_dill', 'sensor.plant_persilja', 'sensor.plant_timjan',
            'sensor.plant_graslok', 'sensor.plant_dahlia', 'sensor.plant_pelargon',
            'sensor.plant_lavandell', 'sensor.plant_murgrona_1', 'sensor.plant_murgrona_2'
          ] %}
          {% set ns = namespace(items=[]) %}
          {% for e in entities %}
            {% if states(e) in ['due', 'overdue'] %}
              {% set label = state_attr(e, 'display_name') ~ ' (' ~ states(e) ~ ')' %}
              {% set ns.items = ns.items + [label] %}
            {% endif %}
          {% endfor %}
          {{ ns.items }}
