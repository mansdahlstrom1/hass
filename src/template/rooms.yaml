# Room metadata sensors
#
# Each room is a template sensor with attributes describing its growing
# conditions. Plants reference their room by slug in the `room` attribute
# on their sensor. The dashboard uses these to group plants and to show
# per-room context (light direction, brightness, etc).
#
# Slug = the entity_id suffix (sensor.room_<slug>). Keep it stable.
#
# Adding a room: append a new `- name: "Room <Slug>"` block here, then
# the add-plant skill will pick it up.

- sensor:
    - name: "Room Balcony"
      unique_id: room_balcony
      state: "active"
      icon: mdi:balcony
      attributes:
        slug: balcony
        display_name: "Balkong"
        location: outdoor
        windows_direction: west
        sun_hours: 6
        brightness: high
        temperature_range: "outdoor (Malmö, ~−5 to +28 °C across year)"
        humidity_hint: "outdoor, rain-exposed"
        notes: |
          ☀️ Stark eftermiddagssol från ~16:00 — soltåliga arter trivs här.
          🌤️ Halvskuggetåliga växter passar bättre vid sidan av räcket.
          💨 Vindutsatt — förankra större krukor.
          ❄️ Vinter: bara härdiga växter klarar utomhus året om, andra tas in.

    - name: "Room Living Room"
      unique_id: room_living_room
      state: "active"
      icon: mdi:sofa
      attributes:
        slug: living_room
        display_name: "Vardagsrum"
        location: indoor
        windows_direction: south
        sun_hours: 7
        brightness: high
        temperature_range: "indoor (~20–28 °C, blir mycket varmt under sommardagar)"
        humidity_hint: "indoor, torr — torrt på vintern, varmt på sommaren"
        notes: |
          🌞 4 fönster (1 öster, 1 sydöst, 2 söder), 7+h ljus, varmt på sommaren.
          🌤️ Söderfönstren får stark direkt sol — använd tunn gardin under sommardagar.
          🌱 Östra fönstret är skonsammare — bra för känsliga eller variegerade växter.
          ☀️ Sommarvärme torkar små krukor på timmar — gruppera dem för luftfuktighet.

    - name: "Room Studio"
      unique_id: room_studio
      state: "active"
      icon: mdi:palette
      attributes:
        slug: studio
        display_name: "Studio"
        location: indoor
        windows_direction: south
        sun_hours: 5
        brightness: high
        temperature_range: "indoor (~20 °C, varmare vid söderfönstret i sommarsolen)"
        humidity_hint: "indoor, dry — söderfönster ger torrare luft i värmen"
        notes: |
          🌞 Söderfönster med stark direkt middagssol.
          🌤️ Soltåliga arter trivs nära glaset; känsliga arter en bit in eller bakom tunn gardin.
          🌿 Sidoplacering ger ljust läge utan brännande direktsol.

    - name: "Room Kitchen"
      unique_id: room_kitchen
      state: "active"
      icon: mdi:silverware-fork-knife
      attributes:
        slug: kitchen
        display_name: "Kök"
        location: indoor
        windows_direction: unknown
        sun_hours: "unknown"
        brightness: unknown
        temperature_range: "indoor (~20 °C, varmare nära spis)"
        humidity_hint: "indoor, vissa fuktspikar vid matlagning"
        notes: "Fyll i fönsterriktning och ljus när första växten läggs till."

    - name: "Room Bedroom"
      unique_id: room_bedroom
      state: "active"
      icon: mdi:bed
      attributes:
        slug: bedroom
        display_name: "Sovrum"
        location: indoor
        windows_direction: east
        sun_hours: 3
        brightness: medium
        temperature_range: "indoor (~20 °C, kan bli ganska varmt särskilt sommartid)"
        humidity_hint: "indoor, dry — torrare på vintern, kan bli varmt på sommaren"
        notes: |
          🌅 Östra fönster ger mild morgonsol fram till ~middag.
          🌤️ Gardiner är fördragna fram till ~9 förmiddagen — ljuset är ytterligare filtrerat.
          🌡️ Kan bli ganska varmt sommartid — vattna oftare och vädra.
          💧 Sen eftermiddag är skuggig — håll inte jorden för blöt på vintern.
